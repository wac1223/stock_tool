name: stock-bot

on:
  workflow_dispatch:
    inputs:
      run_backtest:
        description: "監視銘柄を対象にバックテストも実行する"
        required: false
        default: false
        type: boolean
      backtest_start:
        description: "バックテスト開始日 (YYYY-MM-DD)"
        required: false
        default: "2024-01-01"
        type: string

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run stock bot
        env:
          LINE_TOKEN: ${{ secrets.LINE_TOKEN }}
          USER_ID: ${{ secrets.USER_ID }}
          GOOGLE_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
        run: |
          echo "=== Running stock bot ==="
          python main.py

      - name: Run backtest for watchlist
        if: ${{ inputs.run_backtest }}
        env:
          GOOGLE_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
        run: |
          echo "=== Running backtest for watchlist ==="
          python backtest.py --from-watchlist --start "${{ inputs.backtest_start }}"

      - name: Upload backtest results
        if: ${{ inputs.run_backtest }}
        uses: actions/upload-artifact@v4
        with:
          name: backtest-output
          path: backtest_output/
          if-no-files-found: error

      - name: Commit & Push asset history
        run: |
          echo "=== Commit changes ==="
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          # バックテスト結果は Actions の成果物として配布し、履歴コミットは肥大化させない。
          git add . ':!backtest_output'
          git commit -m "auto update history" || exit 0

          echo "=== Push changes ==="
          git pull --rebase
          git push
